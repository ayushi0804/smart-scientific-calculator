<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="calc">

        <div class="display">
            <input type="text" id="display" placeholder="Enter value..." readonly />        
        </div>

        <div class="row top">
            <button class="func" onclick="sin()">sin</button>
            <button class="func" onclick="cos()">cos</button>
            <button class="func" onclick="tan()">tan</button>
            <button class="func" onclick="log()">log</button>
        </div>

        <div class="row">
            <button class="func" onclick="sqrt()">√</button>
            <button class="func" onclick="power()">x²</button>
            <button class="func" onclick="insertPI()">π</button>
            <button class="clear" onclick="clearDisplay()">C</button>
        </div>

        <div class="row">
            <button onclick="insert('7')">7</button>
            <button onclick="insert('8')">8</button>
            <button onclick="insert('9')">9</button>
            <button class="op" onclick="insert('/')">÷</button>
        </div>

        <div class="row">
            <button onclick="insert('4')">4</button>
            <button onclick="insert('5')">5</button>
            <button onclick="insert('6')">6</button>
            <button class="op" onclick="insert('*')">×</button>
        </div>

        <div class="row">
            <button onclick="insert('1')">1</button>
            <button onclick="insert('2')">2</button>
            <button onclick="insert('3')">3</button>
            <button class="op" onclick="insert('-')">−</button>
        </div>

        <div class="row">
            <button onclick="insert('0')" class="zero">0</button>
            <button onclick="insert('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>
            <button class="op" onclick="insert('+')">+</button>
        </div>

    </div>
</div>

<script src="script.js"></script>
</body>
</html>
